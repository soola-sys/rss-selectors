<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rss-Selectors</title>
    <link rel="icon" type="image/x-icon" href="../" />
  </head>
  <body>
    <div class="wrapper">
      <main class="main">
        <div class="plates">
          <h2 class="text">Select the plates</h2>
          <button type="button" class="help">Help</button>
          <div class="table-wrapper">
            <div class="table">
              <div class="item">bla bla bla</div>
            </div>
            <div class="table-edge"></div>
          </div>
        </div>
        <div class="editor">
            <div class="css-viewer">
                <div class="css-header">
                    <p class="css-text">CSS Editor</p>
                    <p class="css-text">style.css</p>
                </div>
                <div class="css-main">
                    <ul class="css-list">
                        <li>1</li>
                        <li>2</li>
                        <li>3</li>
                        <li>4</li>
                    </ul>
                    <div class="selectors">
                        <input type="text">
                        <button class="btn" type="button">Enter</button>
                    </div>
                </div>
            </div>
            <div class="html-viewer">
            </div>
        </div>
        <div class="links">Made by @flukeout — come say hi!</div>
      </main>
      <aside class="sidebar">
        <div class="levels">
          <ul class="list">
            <li>1</li>
            <li>2</li>
            <li>3</li>
          </ul>
        </div>
      </aside>
    </div>
  </body>
</html>
